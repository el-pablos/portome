name: Release

on:
  push:
    branches: [main, second]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Auto tag and latest release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Package build artifact
        run: |
          cd build
          zip -r ../portome-build.zip .

      - name: Generate tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA_SHORT=$(git rev-parse --short HEAD)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/_' '--')
          TAG="v${VERSION}.${GITHUB_RUN_NUMBER}-${SAFE_BRANCH}-${SHA_SHORT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --oneline --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Portome ${{ steps.tag.outputs.tag }}
          body: |
            ## Ringkasan
            Release otomatis dari branch `${{ github.ref_name }}`.

            ## Changes
            ${{ steps.changelog.outputs.changes }}
          files: portome-build.zip
          make_latest: true
          generate_release_notes: true
