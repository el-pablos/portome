name: CI

on:
  push:
    branches: [main, second]
  pull_request:
    branches: [main, second]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, and build on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: false

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload build
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 14
